name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha grep pattern; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      matrix:
        node-version: [14, 16]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run compile
            npx mocha --reporter dot --bail --grep "${{ inputs.test-filter }}" test/index.js
          else
            npm test
          fi

      - name: Pack package
        if: matrix.node-version == 16
        run: npm pack

      - name: Upload package tarball
        if: matrix.node-version == 16
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: socket.io-parser-4.2.2.tgz
          if-no-files-found: error

  test-browser:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm ci

      - run: npm test
        env:
          BROWSERS: 1
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
